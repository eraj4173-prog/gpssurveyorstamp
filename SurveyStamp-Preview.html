        :root{
          --bg:#F5F7FA;
          --text:#101418;
          --sec:#5B6670;
          --accent:#2563EB;
          --accent-light:#E8EFFE;
          --border:#E1E6EB;
          --danger:#C23B3B;
          --white:#ffffff;
        }
        *{box-sizing:border-box}
        html,body,#root{margin:0;padding:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
        .app-shell{
          min-height:100vh;
          background:var(--bg);
          padding-top:var(--safe-area-inset-top);
          overflow-x:clip;
        }
        .screen{
          max-width:480px;
          margin:0 auto;
          min-height:100vh;
          position:relative;
          padding-bottom:100px;
        }
        .home-pad{padding:24px 16px 0 16px}
        .title{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:8px 0 16px 0}
        .search{
          width:100%;
          background:var(--white);
          border:1px solid var(--border);
          border-radius:14px;
          padding:14px 14px 14px 40px;
          font-size:16px;
          outline:none;
          box-shadow:0 1px 2px rgba(16,20,24,0.04);
        }
        .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
        .search-wrap{position:relative;margin-bottom:18px}
        .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sec)}
        .folder-row{
          display:flex;align-items:center;justify-content:space-between;
          background:var(--white);
          border:1px solid var(--border);
          border-radius:14px;
          padding:14px 14px;
          margin-bottom:10px;
          box-shadow:0 1px 3px rgba(16,20,24,0.06);
        }
        .folder-main{flex:1;min-width:0;cursor:pointer}
        .folder-name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .folder-meta{font-size:13px;color:var(--sec);margin-top:2px;display:flex;gap:8px}
        .icon-btn{
          width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--white);display:grid;place-items:center;cursor:pointer;margin-left:8px;
        }
        .icon-btn:active{transform:scale(0.97)}
        .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
        .floating{
          position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
          background:var(--accent);color:white;border:none;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(37,99,235,0.28);cursor:pointer;z-index:5;
          display:flex;align-items:center;gap:8px;
        }
        .floating:active{transform:translateX(-50%) scale(0.98)}
        .round-cam{
          position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
          width:64px;height:64px;border-radius:50%;background:var(--accent);border:none;display:grid;place-items:center;color:white;box-shadow:0 8px 24px rgba(37,99,235,0.32);cursor:pointer;z-index:5;
        }
        .empty{color:var(--sec);text-align:center;padding:48px 24px;font-size:15px;line-height:1.5}
        .back-row{display:flex;align-items:center;gap:10px;padding:16px 16px 8px 16px}

        }

        }

        }

        }
        .cam-thumb img{width:100%;height:100%;object-fit:cover}
