name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Patch AndroidManifest
        run: |
          python3 << 'PY'
          import pathlib, re
          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          if not mf.exists():
              print('Manifest missing'); exit(0)
          t = mf.read_text()
          for p in ['android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.INTERNET']:
              if p not in t:
                  t = t.replace('<application', f'    <uses-permission android:name="{p}" />\n    <application',1)
          if 'WRITE_EXTERNAL_STORAGE' not in t:
              t = t.replace('<application','    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application',1)
          if 'android:screenOrientation' not in t:
              t = t.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="portrait"')
          else:
              t = re.sub(r'android:screenOrientation="[^"]+"','android:screenOrientation="portrait"',t)
          mf.write_text(t)
          print('patched')
          PY
      - run: npx cap sync android
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SurveyStamp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
